<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="440" viewBox="0 0 1290 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9aa0a6" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect width="1290" height="440" fill="#ffffff"/>

  <text x="16" y="28" font-size="16" font-weight="bold" fill="#202124">MI450 MXFP8 GEMM: the split-K TDM half-slot pipeline</text>
  <text x="16" y="50" font-size="11" fill="#5f6368">mxfp8_splitk_tdm.py, splitk_consume_and_refill. Four K128 half-slots in one indexed ring, two half-steps per K256 tile, one scaled WMMA each.</text>

  <!-- legend row 1 -->
  <rect x="16"  y="66" width="14" height="14" rx="2" fill="#8b5fbf" stroke="#5b3d80"/>
  <text x="36"  y="77" font-size="10.5" fill="#202124">operand read (ds_read)</text>
  <rect x="176" y="66" width="14" height="14" rx="2" fill="#dccdf2" stroke="#a98fd0"/>
  <text x="196" y="77" font-size="10.5" fill="#202124">scale read (ds_read)</text>
  <rect x="326" y="66" width="14" height="14" rx="2" fill="#f0a030" stroke="#b3741a"/>
  <text x="346" y="77" font-size="10.5" fill="#202124">WMMA (matrix unit)</text>
  <rect x="476" y="66" width="14" height="14" rx="2" fill="#f48fb1" stroke="#b85f7f"/>
  <text x="496" y="77" font-size="10.5" fill="#202124">cluster.arrive / cluster.wait</text>
  <rect x="656" y="66" width="14" height="14" rx="2" fill="#4dd0e1" stroke="#2a8f9c"/>
  <text x="676" y="77" font-size="10.5" fill="#202124">TDM async_load, global to LDS (K128)</text>

  <!-- legend row 2 -->
  <rect x="16"  y="88" width="14" height="14" rx="2" fill="url(#hatch)" stroke="#9aa0a6"/>
  <text x="36"  y="99" font-size="10.5" fill="#202124">tdm.async_wait(6), outside every stage region</text>
  <line x1="286" y1="86" x2="286" y2="104" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="296" y="99" font-size="10.5" fill="#202124">stage barrier</text>
  <rect x="396" y="88" width="14" height="14" rx="2" fill="#f0a030" stroke="#b3741a" opacity="0.35"/>
  <text x="416" y="99" font-size="10.5" fill="#202124">region from the adjacent tile</text>

  <!-- stage region captions -->
  <text x="259" y="140" font-size="10" fill="#5f6368" text-anchor="middle">stage0 refill</text>
  <text x="430" y="140" font-size="10" fill="#5f6368" text-anchor="middle">stage0 read</text>
  <text x="567" y="140" font-size="10" fill="#5f6368" text-anchor="middle">stage1</text>
  <text x="715" y="140" font-size="10" fill="#5f6368" text-anchor="middle">stage0 refill</text>
  <text x="886" y="140" font-size="10" fill="#5f6368" text-anchor="middle">stage0 read</text>
  <text x="1023" y="140" font-size="10" fill="#5f6368" text-anchor="middle">stage1</text>

