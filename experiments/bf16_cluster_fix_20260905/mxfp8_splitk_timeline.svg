  <rect x="694" y="214" width="110" height="42" rx="3" fill="#f0a030" stroke="#b3741a"/>
  <text x="749" y="231" font-size="9" fill="#2b1a05" text-anchor="middle">wmma_scaled</text>
  <text x="749" y="243" font-size="8" fill="#2b1a05" text-anchor="middle">e4m3 x e4m3, K128</text>

  <rect x="792" y="223" width="12" height="24" fill="url(#hatch)" stroke="#9aa0a6"/>

  <!-- half-step 1 : refill region -->
  <g>
