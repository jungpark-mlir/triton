    <text x="832" y="231" font-size="8.5" fill="#3d1f2b" text-anchor="middle">cluster</text>
    <text x="832" y="242" font-size="8.5" fill="#3d1f2b" text-anchor="middle">arrive, wait</text>
    <rect x="858" y="214" width="38" height="42" rx="3" fill="#4dd0e1" stroke="#2a8f9c"/>
    <text x="877" y="231" font-size="8.5" fill="#123" text-anchor="middle">TDM A</text>
    <text x="877" y="242" font-size="8" fill="#123" text-anchor="middle">t+2 lo</text>
    <rect x="898" y="214" width="38" height="42" rx="3" fill="#4dd0e1" stroke="#2a8f9c"/>
    <text x="917" y="231" font-size="8.5" fill="#123" text-anchor="middle">TDM B</text>
    <text x="917" y="242" font-size="8" fill="#123" text-anchor="middle">t+2 lo</text>
    <rect x="938" y="214" width="48" height="42" rx="3" fill="#4dd0e1" stroke="#2a8f9c"/>
    <text x="962" y="231" font-size="8.5" fill="#123" text-anchor="middle">TDM fused</text>
    <text x="962" y="242" font-size="8" fill="#123" text-anchor="middle">As+Bs</text>
  </g>
  <!-- half-step 1 : read region -->
