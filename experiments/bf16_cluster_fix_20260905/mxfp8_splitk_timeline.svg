  <!-- span brackets -->
  <path d="M170 276 L170 282 L1078 282 L1078 276" fill="none" stroke="#5f6368" stroke-width="1"/>
  <text x="624" y="296" font-size="9.5" fill="#5f6368" text-anchor="middle">Group A: one K256 tile = two half-steps, 6 warp_pipeline_stage regions, 6 TDM descriptors</text>
  <path d="M352 306 L352 312 L1260 312 L1260 306" fill="none" stroke="#5f6368" stroke-width="1"/>
  <text x="806" y="326" font-size="9.5" fill="#5f6368" text-anchor="middle">Group B: the same 6 regions, one region later</text>

  <!-- footnote -->
  <text x="16" y="352" font-size="9.5" fill="#3c4043">Split-K refill: each half-step refills the half-slot drained one half-step ago, so the lead rises from 1.0 tile (deferred K256) to 1.5 tiles without extra LDS. The refill sits</text>
  <text x="16" y="366" font-size="9.5" fill="#3c4043">in its own stage0 region, ahead of a second stage0 region holding the reads, so the stage barrier between them is what the trailing waves rely on: base+3 and base+4 both</text>
  <text x="16" y="380" font-size="9.5" fill="#3c4043">alias the half-slot read one half-step earlier, and base+4 reduces to base under the modulus. Ring wait is 6 = 3 descriptors x (4 - 2) half-slots.</text>
  <text x="16" y="398" font-size="9.5" fill="#3c4043">Cost: a K128 copy moves 128 contiguous bytes per row instead of 256, which doubles GL2 requests for the same bytes. Measured 329.3 us against 297.9 us for deferred</text>
  <text x="16" y="412" font-size="9.5" fill="#3c4043">K256 and 270.5 us for the shipped same-slot schedule, at 4096x4096x65536.</text>
  <text x="16" y="430" font-size="8.5" fill="#80868b">Schematic. Region contents are from mxfp8_splitk_tdm.py, splitk_consume_and_refill. Box widths show the operation mix, not measured cycle counts.</text>
</svg>
