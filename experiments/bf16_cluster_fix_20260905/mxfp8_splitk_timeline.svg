  <text x="16" y="248" font-size="9.5" fill="#5f6368">waves 4-7</text>

  <!-- trailing region of the previous tile -->
  <rect x="170" y="214" width="110" height="42" rx="3" fill="#f0a030" stroke="#b3741a" opacity="0.35"/>
  <text x="225" y="238" font-size="8.5" fill="#2b1a05" text-anchor="middle" opacity="0.7">wmma (prev tile)</text>
  <rect x="292" y="223" width="12" height="24" fill="url(#hatch)" stroke="#9aa0a6" opacity="0.45"/>

  <!-- half-step 0 : refill region -->
  <g>
    <rect x="352" y="214" width="48" height="42" rx="3" fill="#f48fb1" stroke="#b85f7f"/>
    <text x="376" y="231" font-size="8.5" fill="#3d1f2b" text-anchor="middle">cluster</text>
    <text x="376" y="242" font-size="8.5" fill="#3d1f2b" text-anchor="middle">arrive, wait</text>
    <rect x="402" y="214" width="38" height="42" rx="3" fill="#4dd0e1" stroke="#2a8f9c"/>
    <text x="421" y="231" font-size="8.5" fill="#123" text-anchor="middle">TDM A</text>
    <text x="421" y="242" font-size="8" fill="#123" text-anchor="middle">t+1 hi</text>
    <rect x="442" y="214" width="38" height="42" rx="3" fill="#4dd0e1" stroke="#2a8f9c"/>
    <text x="461" y="231" font-size="8.5" fill="#123" text-anchor="middle">TDM B</text>
    <text x="461" y="242" font-size="8" fill="#123" text-anchor="middle">t+1 hi</text>
    <rect x="482" y="214" width="48" height="42" rx="3" fill="#4dd0e1" stroke="#2a8f9c"/>
    <text x="506" y="231" font-size="8.5" fill="#123" text-anchor="middle">TDM fused</text>
    <text x="506" y="242" font-size="8" fill="#123" text-anchor="middle">As+Bs</text>
  </g>
  <!-- half-step 0 : read region -->
  <g>
    <rect x="534" y="214" width="44" height="42" rx="3" fill="#8b5fbf" stroke="#5b3d80"/>
    <text x="556" y="231" font-size="8.5" fill="#fff" text-anchor="middle">ds_read A</text>
    <text x="556" y="242" font-size="8" fill="#e8dcf5" text-anchor="middle">slot base+0</text>
